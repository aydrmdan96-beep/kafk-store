<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعلم الحروف العربية للأطفال</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#fff8d8;color:#222;text-align:center}
header{background:#111;color:white;padding:22px 15px}
header h1{margin:0;font-size:30px}
.container{max-width:700px;margin:auto;padding:20px 15px 35px}
.intro{font-size:20px;line-height:1.8;margin:10px 0 20px}
.card{background:white;border-radius:25px;padding:25px 15px;box-shadow:0 5px 18px rgba(0,0,0,.15)}
.letter{font-size:120px;font-weight:bold;color:#ff7900;line-height:1.1}
.word{font-size:34px;font-weight:bold;margin:10px 0}
.picture{font-size:85px;margin:8px 0 18px}
.sound,.nav button{border:0;border-radius:15px;padding:14px 22px;font-size:19px;font-weight:bold;cursor:pointer}
.sound{background:#ff7900;color:white}
.nav{display:flex;justify-content:center;gap:12px;margin-top:20px}
.nav button{background:#ffd34d}
.counter{font-size:18px;margin-top:15px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:25px}
.grid button{border:0;border-radius:12px;padding:9px 2px;background:#f1f1f1;font-size:24px;font-weight:bold;cursor:pointer}
.grid button.active{background:#ff7900;color:white}
.note{font-size:15px;line-height:1.7;margin-top:22px}
</style>
</head>
<body>
<header><h1>📚 كافك Store</h1></header>
<div class="container">
<h2>تعلم الحروف العربية للأطفال 🔤</h2>
<p class="intro">كتاب تفاعلي ممتع يساعد الأطفال على تعلّم الحروف العربية بطريقة سهلة وبسيطة.</p>
<div class="card">
<div id="letter" class="letter">أ</div>
<div id="picture" class="picture">🦁</div>
<div id="word" class="word">أسد</div>
<button class="sound" onclick="speakLetter()">🔊 اسمع الحرف</button>
<div class="nav">
<button onclick="previousLetter()">⬅️ السابق</button>
<button onclick="nextLetter()">التالي ➡️</button>
</div>
<div id="counter" class="counter">1 من 28</div>
</div>
<div id="grid" class="grid"></div>
<p class="note">اضغط على أي حرف للانتقال إليه، ثم اضغط 🔊 لسماع نطق الحرف والكلمة.</p>
</div>
<script>
const letters=[
["أ","أسد","🦁"],["ب","بطة","🦆"],["ت","تفاحة","🍎"],["ث","ثعلب","🦊"],
["ج","جمل","🐪"],["ح","حصان","🐴"],["خ","خروف","🐑"],["د","دب","🐻"],
["ذ","ذرة","🌽"],["ر","رمان","🍎"],["ز","زهرة","🌸"],["س","سمكة","🐟"],
["ش","شمس","☀️"],["ص","صقر","🦅"],["ض","ضفدع","🐸"],["ط","طائرة","✈️"],
["ظ","ظرف","✉️"],["ع","عنب","🍇"],["غ","غزال","🦌"],["ف","فراشة","🦋"],
["ق","قمر","🌙"],["ك","كتاب","📖"],["ل","ليمون","🍋"],["م","موز","🍌"],
["ن","نحلة","🐝"],["هـ","هلال","🌙"],["و","وردة","🌹"],["ي","يد","✋"]
];
let current=0;
function showLetter(index){
 current=index;
 document.getElementById("letter").textContent=letters[index][0];
 document.getElementById("word").textContent=letters[index][1];
 document.getElementById("picture").textContent=letters[index][2];
 document.getElementById("counter").textContent=(index+1)+" من "+letters.length;
 document.querySelectorAll("#grid button").forEach((b,i)=>b.classList.toggle("active",i===index));
}
function speakLetter(){
 if(!("speechSynthesis" in window)){alert("المتصفح لا يدعم تشغيل الصوت.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance("حرف "+letters[current][0]+". "+letters[current][1]);
 u.lang="ar-SA";u.rate=.75;speechSynthesis.speak(u);
}
function nextLetter(){showLetter((current+1)%letters.length)}
function previousLetter(){showLetter((current-1+letters.length)%letters.length)}
const grid=document.getElementById("grid");
letters.forEach((item,index)=>{
 const b=document.createElement("button");b.textContent=item[0];b.onclick=()=>showLetter(index);grid.appendChild(b);
});
showLetter(0);
</script>
</body>
</html>
