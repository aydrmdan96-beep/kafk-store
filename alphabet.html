<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تعلم الأحرف العربية للأطفال</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:"Arial","Tahoma",sans-serif;background:#eaf7ff}
body{overflow:hidden}
#book{width:100%;height:100%;position:relative}
.page{display:none;width:100%;height:100%;position:absolute;inset:0;align-items:center;justify-content:center}
.page.active{display:flex}
.cover{background:#fff}
.cover img{width:100%;height:100%;object-fit:contain}
.letter-page{
 background:linear-gradient(180deg,#2f6de5 0%,#4b82ed 55%,#b9ec91 100%);
 position:relative; overflow:hidden; color:#fff;
}
.cloud{position:absolute;background:rgba(255,255,255,.92);border-radius:50%;filter:blur(.2px);opacity:.9}
.c1{width:170px;height:65px;top:4%;right:-30px}
.c2{width:140px;height:55px;top:10%;left:-30px}
.grass{position:absolute;bottom:0;left:0;right:0;height:24%;background:#9de06e;border-radius:50% 50% 0 0}
.card{position:relative;z-index:2;text-align:center;width:min(92vw,520px);padding:22px}
.small-title{font-size:clamp(22px,5vw,34px);font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.08);margin-bottom:4px}
.big-letter{font-size:clamp(150px,42vw,310px);line-height:.9;font-weight:900;color:#fff;text-shadow:5px 6px 0 #f5c62d,-2px -2px 0 #f5c62d;margin:8px 0}
.name{font-size:clamp(30px,8vw,52px);font-weight:900;color:#ffd53d;margin:5px 0 12px}
.example{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#2359bb;border-radius:22px;padding:10px 20px;font-size:clamp(22px,6vw,34px);font-weight:800;box-shadow:0 5px 14px rgba(0,0,0,.16)}
.speaker{margin-top:18px;border:0;border-radius:999px;background:#ffcf2f;color:#143b84;font-size:clamp(20px,5.5vw,30px);font-weight:900;padding:14px 24px;box-shadow:0 5px 0 #d69d00;cursor:pointer}
.speaker:active{transform:translateY(3px);box-shadow:0 2px 0 #d69d00}
.controls{position:absolute;z-index:5;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:12px;direction:ltr}
.nav{border:0;border-radius:18px;padding:10px 18px;background:rgba(255,255,255,.94);color:#2258b7;font-size:18px;font-weight:800;cursor:pointer}
.counter{background:rgba(0,0,0,.18);color:#fff;border-radius:18px;padding:10px 15px;font-weight:800}
.hint{position:absolute;z-index:4;top:12px;left:12px;right:12px;text-align:center;font-size:14px;color:rgba(255,255,255,.9)}
@media (orientation:landscape) {
 .big-letter{font-size:min(35vh,230px)}
 .card{padding-top:8px}
 .controls{bottom:8px}
}
</style>
</head>
<body>
<div id="book"></div>

;واو&quot;, &quot;word&quot;: &quot;وردة&quot;}, {&quot;type&quot;: &quot;letter&quot;, &quot;letter&quot;: &quot;ي&quot;, &quot;name&quot;: &quot;ياء&quot;, &quot;word&quot;: &quot;يد&quot;}];

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("المتصفح لا يدعم النطق الصوتي.");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ar-SA";
  u.rate = 0.72;
  u.pitch = 1.05;
  speechSynthesis.speak(u);
}

}
function go(delta) {
  current = Math.max(0, Math.min(pages.length-1, current + delta));
  render();
}
document.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft") go(-1);
  if(e.key==="ArrowRight") go(1);
});
let sx=0;
document.addEventListener("touchstart",e=>{sx=e.changedTouches[0].screenX},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].screenX-sx;
  if(Math.abs(dx)>60) go(dx<0?1:-1);
},{passive:true});
render();
</script>
