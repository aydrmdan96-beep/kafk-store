<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كافك Store</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8d8;
  color: #222;
  text-align: center;
}

header {
  background: #111;
  color: white;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 25px 15px;
}

h2 {
  font-size: 28px;
  margin: 10px 0;
}

.description {
  font-size: 19px;
  line-height: 1.8;
}

.cover {
  width: 300px;
  max-width: 90%;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  display: block;
  margin: 20px auto;
}

.price {
  font-size: 26px;
  font-weight: bold;
  margin: 22px 0;
}

.btn {
  display: inline-block;
  border-radius: 15px;
  padding: 17px 25px;
  margin: 8px;
  font-size: 20px;
  font-weight: bold;
  text-decoration: none;
}

.book {
  background: #ff7900;
  color: white;
}

.instagram {
  background: #ffd34d;
  color: #173b70;
}

.note {
  font-size: 16px;
  line-height: 1.7;
}
</style>
</head>

<body>

<header>
  <h1>كافك Store</h1>
</header>

<div class="container">

  <h2>كتاب تعلم الأحرف الإنجليزية للأطفال 📚</h2>

  <p class="description">
    كتاب تفاعلي ممتع يساعد الأطفال على تعلم الحروف الإنجليزية بطريقة سهلة وبسيطة.
  </p>

  <img
    class="cover"
    src="cover 1.jpg"
    alt="غلاف كتاب تعلم الأحرف"
  >

  <a
    class="btn book"
    href="alphabet-index.html"
  >
    🔊 فتح الكتاب التفاعلي
  </a>

  <div class="price">
    5,000 دينار عراقي
  </div>

  <p class="note">
    بعد إتمام الطلب سيتم تزويدك بالملف.
  </p>

  <a
    class="btn instagram"
    href="https://www.instagram.com/aydrmdan96/"
    target="_blank"
  >
    📩 اطلب عبر إنستغرام
  </a>

</div>

</body>
</html>
